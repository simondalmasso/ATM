name: ATM GitLab downstream mirror

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atm-gitlab-downstream-mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact GitHub main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mirror credential gate
        id: gate
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_MIRROR_TOKEN:-}" ]; then
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GITLAB_MIRROR_TOKEN is not configured; downstream mirror skipped safely."
            exit 0
          fi
          echo "armed=true" >> "$GITHUB_OUTPUT"

      - name: Push exact GitHub main to GitLab mirror branch
        if: steps.gate.outputs.armed == 'true'
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
          DEST_URL: https://gitlab.com/simondalmasso/ATM.git
          DEST_REF: refs/heads/github-main
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          ASKPASS="$RUNNER_TEMP/gitlab-askpass.sh"
          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "oauth2" ;;
            *Password*) printf '%s\n' "$GITLAB_MIRROR_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0

          git remote add gitlab "$DEST_URL"

          BEFORE_SHA="$(git ls-remote gitlab "$DEST_REF" | awk '{print $1}')"
          if [ -n "$BEFORE_SHA" ]; then
            if ! git merge-base --is-ancestor "$BEFORE_SHA" "$GITHUB_SHA"; then
              echo "::error::GitLab github-main diverged from GitHub main; refusing force push."
              exit 1
            fi
          fi

          git push -o ci.skip gitlab "$GITHUB_SHA:$DEST_REF"

          AFTER_SHA="$(git ls-remote gitlab "$DEST_REF" | awk '{print $1}')"
          test "$AFTER_SHA" = "$GITHUB_SHA"

          {
            echo "### ATM GitLab downstream mirror"
            echo "- source: GitHub main"
            echo "- source_sha: $GITHUB_SHA"
            echo "- destination: gitlab.com/simondalmasso/ATM"
            echo "- destination_ref: github-main"
            echo "- gitlab_ci: skipped via push option"
            echo "- force_push: false"
            echo "- legacy_gitlab_main_modified: false"
            echo "- readback: PASS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mirror is not armed
        if: steps.gate.outputs.armed != 'true'
        shell: bash
        run: |
          {
            echo "### ATM GitLab downstream mirror"
            echo "- status: HUMAN_GATE"
            echo "- reason: repository secret GITLAB_MIRROR_TOKEN is missing"
            echo "- no GitLab write attempted"
            echo "- no GitLab runner minutes used"
          } >> "$GITHUB_STEP_SUMMARY"
