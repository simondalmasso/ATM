name: ORDER-010 SG2 Simon Gate

on:
  push:
    branches: [pivot/universal-money-radar-r1]
    paths:
      - '.github/workflows/order010-sg2-simon-gate.yml'
      - 'src/atm_core/simon_gate.py'
      - 'src/atm_core/human_gate.py'
      - 'scripts/order010_simon_gate.py'
      - 'scripts/order021_sg2_human_gate.py'
      - 'tests/test_order010_simon_gate.py'
      - 'tests/test_order021_sg2_bridge.py'
      - 'src/atm_core/superteam_agent.py'
      - 'tests/test_superteam_agent.py'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: order010-sg2-simon-gate
  cancel-in-progress: false

jobs:
  simon-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src:.
      ORDER010_HEAD: ${{ github.sha }}
      ATM_RADAR_BOT_API_KEY: ${{ secrets.ATM_RADAR_BOT_API_KEY }}
      ATM_TELEGRAM_CHAT_ID: ${{ vars.ATM_TELEGRAM_CHAT_ID }}
      ATM_TELEGRAM_EFFECT_LOCK: ${{ vars.ATM_TELEGRAM_EFFECT_LOCK }}
      GITHUB_TOKEN: ${{ github.token }}
      SUPERTEAM_AGENT_API_KEY: ${{ secrets.SUPERTEAM_AGENT_API_KEY }}
      SUPERTEAM_AGENT_ID: '80aa9714-ca88-4759-b9c8-1b573149160f'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Exact-head zero-spend preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('config/atm.example.json').read_text())
          assert cfg['outgoing_spend_usd'] == 0
          assert cfg['zero_cost_models']['paid_fallback'] is False
          print('ORDER010_SG2_EXACT_HEAD=PASS')
          print('ONE_HUMAN_GATE_TRUTH=ORDER021')
          print('OUTGOING_SPEND_USD=0')
          PY

      - name: Install ATM package
        run: python -m pip install --disable-pip-version-check -e .

      - name: SG2 canonical bridge and Superteam boundary tests
        run: |
          python -m unittest tests.test_order010_simon_gate -v
          python -m unittest tests.test_order021_sg2_bridge -v
          python -m unittest tests.test_superteam_agent -v

      - name: Prove Superteam LIST auth does not require claimCode
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from atm_core.superteam_agent import SuperteamAgentApi
          out={'api_key_present':bool(os.environ.get('SUPERTEAM_AGENT_API_KEY','').strip()),'agent_id':os.environ['SUPERTEAM_AGENT_ID'],'claim_code_required_by_runtime':False,'new_agent_registration_allowed':False}
          if not out['api_key_present']:
              out['state']='AUTH_REQUIRED_API_KEY_ONLY'
          else:
              try:
                  data=SuperteamAgentApi().live_agent_eligible(take=50); rows=data.get('listings') or data.get('data') or []
                  out['state']='LIVE_AUTH_PASS'; out['returned_count']=len(rows) if isinstance(rows,list) else 'UNKNOWN'
              except Exception as exc:
                  out['state']='LIVE_AUTH_FAIL'; out['error_type']=type(exc).__name__
          Path('order010-superteam-runtime.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Execute SG2 discovery and qualification only
        run: python scripts/order010_simon_gate.py

      - name: Persist canonical HumanGateRequest then optional Telegram
        run: python scripts/order021_sg2_human_gate.py

      - name: Merge sanitized Superteam evidence into diagnostic SG2 receipt
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('order010-simon-gate-receipt.json')
          receipt=json.loads(p.read_text()) if p.exists() else {'schema':'ATM_ORDER010_SG2_SIMON_GATE_V1','state':'RECEIPT_MISSING','outgoing_spend_usd':'0'}
          st=Path('order010-superteam-runtime.json')
          if st.exists(): receipt['superteam_runtime']=json.loads(st.read_text())
          p.write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          PY

      - name: Publish Issue 38 diagnostic history only
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          p=Path('order010-simon-gate-receipt.json')
          receipt=json.loads(p.read_text()) if p.exists() else {'schema':'ATM_ORDER010_SG2_SIMON_GATE_V1','state':'RECEIPT_MISSING','outgoing_spend_usd':'0'}
          receipt['run_id']=os.environ['GITHUB_RUN_ID']; receipt['run_attempt']=os.environ['GITHUB_RUN_ATTEMPT']; receipt['diagnostic_only']=True; receipt['owner_gate_truth']='ORDER021_HUMAN_GATE_ONLY'
          body='ATM ORDER010 SG2 SIMON GATE STATE\n```json\n'+json.dumps(receipt,sort_keys=True)+'\n```'
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/38/comments",data=json.dumps({'body':body}).encode(),method='POST',headers={'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'ATM-SimonGate/1.0'})
          with urllib.request.urlopen(req,timeout=20) as response: posted=json.loads(response.read().decode())
          print('ORDER010_SG2_DIAGNOSTIC='+str(posted.get('html_url')))
          print('OWNER_GATE_TRUTH=ORDER021_HUMAN_GATE_ONLY')
          print('OUTGOING_SPEND_USD=0')
          PY
