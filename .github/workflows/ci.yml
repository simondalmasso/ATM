name: ATM CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: atm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Worker behavior
        run: |
          set -euo pipefail
          node cloudflare/order034/ATM-ORDER034-WIN101-UI-TEST.mjs
          node cloudflare/order034/ATM-MCP-HEARTBEAT-TEST.mjs
          node cloudflare/order034/ATM-MCP-PUBLIC-TEST.mjs
          node cloudflare/order034/ATM-ORDER034-PLANNER-JSON-TEST.mjs
          node cloudflare/order034/ATM-ORDER034-VERIFIER-JSON-TEST.mjs
          node cloudflare/order034/ATM-ORDER034-ONCHAIN-BLOCKER-TEST.mjs
          node cloudflare/order034/ATM-ORDER034-ECONOMIC-FLOOR-TEST.mjs
          node cloudflare/order034/ATM-ORDER034-GENERIC-ADAPTER-TEST.mjs
          node cloudflare/order034/ATM-ORDER034-HANSA-ADAPTER-TEST.mjs
          node cloudflare/order034/ATM-ORDER034-STATUS-TRUTH-TEST.mjs
          node cloudflare/order034/ATM-ORDER034-WATCHDOG-V1-TEST.mjs
          node cloudflare/order034/ATM-ORDER034-SIGNER-BEHAVIORAL-P0-FINAL.mjs
          node cloudflare/order034/ATM-ORDER051-DEPLOY-READBACK-TEST.mjs
          node cloudflare/order034/ATM-ORDER054-AGENTBOUNTIES-TEST.mjs
          node cloudflare/order034/ATM-ORDER055-GALAXY-RADAR-TEST.mjs
          node scripts/order051-smoke-retry-test.mjs
          node scripts/order054-pathgate-unknown-sha-test.mjs

      - name: Python policy
        run: |
          set -euo pipefail
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/secret_doctor.py
          python scripts/payout_doctor.py

      - name: Repository integrity
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .gitlab-ci.yml
          test ! -d src
          test ! -d deploy
          test ! -d prompts
          test ! -d workers
          test ! -e config/control.json
          test ! -e .github/workflows/atm-cloud-cycle.yml
          test ! -e .github/workflows/atm-cloud-schedule.yml
          test ! -e .github/workflows/oci-remote-bootstrap.yml
          test ! -e .github/workflows/oci-remote-probe.yml

          DEPLOY_WORKFLOW=.github/workflows/deploy-cloudflare.yml
          test -f "$DEPLOY_WORKFLOW"
          grep -Fq 'workflows: ["ATM CI"]' "$DEPLOY_WORKFLOW"
          grep -Fq "github.event.workflow_run.conclusion == 'success'" "$DEPLOY_WORKFLOW"
          grep -Fq "github.event.workflow_run.event == 'push'" "$DEPLOY_WORKFLOW"
          grep -Fq "github.event.workflow_run.head_branch == 'main'" "$DEPLOY_WORKFLOW"

          mapfile -t deploy_authorities < <(grep -RIlE 'CLOUDFLARE_API_TOKEN|wrangler@[^ ]+ versions (upload|deploy)' .github/workflows --exclude=ci.yml | sort)
          test "${#deploy_authorities[@]}" -eq 1
          test "${deploy_authorities[0]}" = "$DEPLOY_WORKFLOW"

          if grep -RInF 'simonkey888' .github/workflows cloudflare/order034/*.jsonc --exclude=ci.yml; then
            echo 'STALE_GITHUB_IDENTITY_FOUND'
            exit 1
          fi

          path_gate_line="$(grep -F "if grep -Eq" "$DEPLOY_WORKFLOW")"
          for nonprod in 'docs/' 'report/' 'tests/' '.github/workflows/ci.yml'; do
            if grep -Fq "$nonprod" <<<"$path_gate_line"; then
              echo "NONPROD_PATH_MARKED_FOR_DEPLOY=$nonprod"
              exit 1
            fi
          done

          for f in 00-baseline 01-github-audit 02-gitlab-runtime-map 03-cleanup-manifest 04-migration-map 05-ci-deploy-design 06-parity-and-cutover; do
            test -f "docs/migration/order051/$f.md"
          done
          if grep -RIlE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|mnemonic[[:space:]]*=|seed_phrase[[:space:]]*=)' . --exclude-dir=.git; then
            echo 'SECRET_MATERIAL_PATTERN_FOUND'
            exit 1
          fi
